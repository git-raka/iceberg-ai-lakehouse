[project]
name = "iceberg-ai-lakehouse"
version = "0.1.0"
description = "Open-source AI lakehouse simulation: Apache Iceberg + REST catalog, Spark, Flink, Trino governance, and a local-LLM AI layer (document extraction, vector search, text-to-SQL, agent over MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyiceberg[pyarrow]==0.12.0",
    "pyarrow==26.0.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "trino==0.340.0",
    "ollama==0.6.3",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "sqlglot==30.25.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
pipeline = [
    "dagster==1.13.27",
    "dagster-webserver==1.13.27",
    "dagster-postgres==0.29.27",
    "psycopg2-binary==2.9.11",  # dagster-postgres' driver
    "pyspark-client==4.1.3",
    "confluent-kafka==2.16.0",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pdf2image==1.17.0",
    "reportlab==5.1.0",
    "faker==40.43.0",
    "pillow==13.0.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
    "jinja2==3.1.6",
]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
