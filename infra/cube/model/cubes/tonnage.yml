# Shared data product: net tons weighed at the estate gate per tenant per day (share.tonnage_daily).
# Vendors reach it through Cube's REST or GraphQL API; Trino decides which tenants each vendor sees.
cubes:
  - name: tonnage
    sql_table: iceberg.share.tonnage_daily
    description: Trucks and net tons weighed at the estate gate per tenant per day.

    dimensions:
      - name: id
        sql: "concat(tenant_id, '|', CAST(day AS VARCHAR))"
        type: string
        primary_key: true
        public: false

      - name: tenant_id
        sql: tenant_id
        type: string
        description: Tenant code (T001..T012)

      - name: day
        sql: "CAST(day AS TIMESTAMP)"
        type: time
        description: Day of weighing

    measures:
      - name: net_tons
        sql: net_tons
        type: sum
        description: Net weight in tons

      - name: trucks
        sql: trucks
        type: sum
        description: Number of trucks weighed
